<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Bookies CMS</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
    <script>
        DecapCMS.init({
            config: {
                backend: {
                    name: "github",
                    repo: "DevTunechi/lawyersbook",
                    branch: "main",
                },
                media_folder: "public/images/counselors",
                public_folder: "/images/counselors",
                collections: [
                    {
                        name: "counselors",
                        label: "Counselors",
                        label_singular: "Counselor",
                        folder: false,
                        files: [
                            {
                                name: "allCounselors",
                                label: "All Counselors",
                                file: "data/counselors.json",
                                fields: [
                                    {
                                        name: "counselors",
                                        label: "Counselors List",
                                        label_singular: "Counselor",
                                        widget: "list",
                                        summary: "{{fields.name}}",
                                        fields: [
                                            { name: "id", label: "ID", widget: "string" },
                                            { name: "slug", label: "Slug", widget: "string" },
                                            { name: "name", label: "Full Name", widget: "string" },
                                            { name: "photoUrl", label: "Photo URL", widget: "image", default: "/images/counselors/default.jpg" },
                                            { name: "bio", label: "Bio", widget: "text" },
                                            { name: "practiceAreas", label: "Practice Areas", widget: "list", default: [] },
                                            { name: "barAdmissions", label: "Bar Admissions", widget: "string" },
                                            { name: "whatsappNumber", label: "WhatsApp Number (international format)", widget: "string" },
                                            { name: "email", label: "Email", widget: "string" },
                                            { name: "yearsExperience", label: "Years of Experience", widget: "number", valueType: "int" },
                                            { name: "languages", label: "Languages", widget: "list", default: [] },
                                            { name: "locationCityState", label: "Location (City, State)", widget: "string" },
                                            { name: "hourlyRate", label: "Hourly Rate (e.g. $1,250)", widget: "string" },
                                            {
                                                name: "notableCases",
                                                label: "Notable Cases / Past Wins",
                                                widget: "list",
                                                summary: "{{fields.case}}",
                                                fields: [{ name: "case", label: "Case Description", widget: "string" }]
                                            },
                                            { name: "isActive", label: "Active", widget: "boolean", default: true },
                                            { name: "order", label: "Display Order", widget: "number", default: 0 }
                                        ]
                                    }
                                ]
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
