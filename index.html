<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Bookies Chamber</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-6">
            <img src="logo.svg" alt="Law Bookies Chamber logo" class="h-12 w-auto">
            <div class="hidden sm:block text-xs text-gray-400">⚖️ Counsel with character</div>
        </div>
        <h1 class="text-3xl font-bold mb-2">Law Bookies Chamber</h1>
        <p class="mb-6 text-gray-600">Professional legal counsel, personally connected</p>
        <div id="filter-bar" class="flex flex-wrap gap-2 mb-6"></div>
        <div id="counselor-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
